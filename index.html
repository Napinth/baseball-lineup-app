<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#0b1f3a" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /><meta name="apple-mobile-web-app-title" content="Lineup" /><link rel="manifest" href="manifest.webmanifest" /><title>iPhone Baseball Lineup</title><style>:root{--blue:#0b1f3a;--royal:#1e5c96;--black:#111;--gray:#d7dbe1;--light:#f5f6f8;--white:#fff;--field:#2c6a4a;--field2:#357957;--dirt:#b9bdc4;--yellow:#f1d84b;}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}body{margin:0;background:#e6e9ee;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;}.app{width:100%;max-width:680px;margin:0 auto;padding-bottom:40px;}.hero{position:sticky;top:0;z-index:50;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:var(--blue);color:#fff;border-bottom:3px solid var(--black);}.hero h1{margin:0;font-size:22px;line-height:1.15;}.hero p{margin:4px 0 0;font-size:13px;color:#dce6f0;}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}button{min-height:46px;border:2px solid var(--black);border-radius:10px;font:inherit;font-weight:800;background:#fff;color:#111;touch-action:manipulation;}.primary{grid-column:1/-1;background:var(--royal);color:#fff;border-color:#fff;}.section{margin-top:12px;background:#fff;border-top:2px solid var(--black);border-bottom:2px solid var(--black);}.section h2{margin:0;padding:11px 14px;background:var(--black);color:#fff;font-size:16px;text-transform:uppercase;letter-spacing:.04em;}.game-grid{display:grid;grid-template-columns:1fr;gap:10px;padding:12px;background:var(--light);}label{display:block;margin-bottom:5px;font-size:12px;font-weight:800;text-transform:uppercase;color:#4b5563;}input,select{width:100%;min-height:50px;border:2px solid #9298a0;border-radius:10px;background:#fff;color:#111;padding:10px 12px;font-size:17px;line-height:1.2;touch-action:manipulation;-webkit-user-select:text;user-select:text;}input:focus,select:focus{outline:3px solid rgba(30,92,150,.22);border-color:var(--royal);}.players{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;}.player-row{display:grid;grid-template-columns:40px minmax(0,1fr) 72px;gap:8px;align-items:center;padding:8px;border:1px solid #c7cbd1;border-radius:11px;background:var(--light);}.order{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-size:16px;font-weight:900;}.status{padding:0 12px 12px;font-size:13px;font-weight:700;color:#4b5563;}.innings{display:grid;gap:18px;padding:12px;}.inning-card{border:3px solid var(--black);border-radius:14px;overflow:hidden;background:#fff;}.inning-title{margin:0;padding:12px;background:var(--royal);color:#fff;text-align:center;font-size:20px;}.diamond{position:relative;width:100%;aspect-ratio:1/1.1;background:repeating-linear-gradient(90deg,var(--field) 0,var(--field) 26px,var(--field2) 26px,var(--field2) 52px);overflow:hidden;border-top:2px solid var(--black);border-bottom:2px solid var(--black);}.dirt{position:absolute;left:50%;top:60%;width:52%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);background:var(--dirt);border:3px solid #fff;border-radius:8%;}.grass{position:absolute;left:50%;top:60%;width:28%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);background:var(--field2);border:2px solid #fff;}.mound{position:absolute;left:50%;top:65%;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:3px solid var(--dirt);z-index:2;}.home{position:absolute;left:50%;bottom:3%;width:7%;aspect-ratio:1;transform:translateX(-50%) rotate(45deg);background:#fff;z-index:2;}.pos{position:absolute;z-index:5;width:34%;}.pos .tag{display:block;padding:3px 4px;background:var(--yellow);border:1px solid var(--black);border-bottom:0;border-radius:7px 7px 0 0;text-align:center;font-size:11px;font-weight:900;color:#111;}.pos select{min-height:40px;padding:5px 6px;border-radius:0 0 7px 7px;border-width:1px;font-size:13px;background:#fff;}.c{left:50%;bottom:1%;transform:translateX(-50%)}.p{left:50%;top:61%;transform:translateX(-50%)}.b1{right:2%;top:63%}.b2{right:17%;top:46%}.ss{left:17%;top:46%}.b3{left:2%;top:63%}.lf{left:1%;top:19%}.lcf{left:23%;top:7%}.rcf{right:23%;top:7%}.rf{right:1%;top:19%}.sits{padding:10px;background:var(--light);}.sits h3{margin:0 0 8px;font-size:14px;color:var(--blue);text-transform:uppercase;}.sit-grid{display:grid;grid-template-columns:1fr;gap:7px;}.sit-grid select{min-height:46px;font-size:15px;}.jump{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:2px solid var(--black);-webkit-overflow-scrolling:touch;}.jump a{flex:0 0 auto;min-width:52px;padding:9px 10px;border:2px solid var(--black);border-radius:9px;background:var(--light);color:#111;text-decoration:none;font-weight:800;text-align:center;}@media (min-width:560px){.game-grid{grid-template-columns:1fr 1fr}.game-grid .full{grid-column:1/-1}.sit-grid{grid-template-columns:repeat(5,1fr)}}.controls-grid{display:grid;grid-template-columns:1fr;gap:10px;padding:12px;background:var(--light);}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:8px;}.segmented button.active{background:var(--royal);color:#fff;border-color:var(--royal);}.roster-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}.roster-actions button:first-child{grid-column:1/-1}.hidden{display:none !important}@media print{@page{size:landscape;margin:.2in}body{background:#fff}.hero{position:static;padding:6px}.hero p,.toolbar,.jump,.status{display:none}.app{max-width:none}.section{margin-top:5px;border:1px solid #000}.players{grid-template-columns:repeat(5,1fr);gap:3px;padding:4px}.player-row{grid-template-columns:20px 1fr 34px;gap:2px;padding:2px}.order{width:18px;height:18px;font-size:8px}input,select{min-height:22px;padding:2px 3px;font-size:8px}.innings{grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}.inning-title{padding:4px;font-size:9px}.pos .tag{font-size:6px;padding:1px}.pos select{min-height:17px;font-size:6px;padding:1px}.sits{padding:3px}.sit-grid{grid-template-columns:repeat(5,1fr);gap:2px}.sit-grid select{min-height:17px;font-size:6px;padding:1px}}</style></head><body><main class="app"><header class="hero"><h1>Baseball Lineup Card</h1><p>Built for iPhone, enter players once, then scroll through six full diamonds.</p><div class="toolbar"><button id="printBtn" class="primary" type="button">Print Lineup</button><button id="updateBtn" type="button">Update Dropdowns</button><button id="clearBtn" type="button">Clear All</button></div></header><nav class="jump" aria-label="Jump to inning"><a href="#inning-1">1</a><a href="#inning-2">2</a><a href="#inning-3">3</a><a href="#inning-4">4</a><a href="#inning-5">5</a><a href="#inning-6">6</a></nav><section class="section"><h2>Game Information</h2><div class="game-grid"><div class="full"><label for="team">Team</label><input id="team" type="text" placeholder="Team name" autocomplete="off"></div><div><label for="opponent">Opponent</label><input id="opponent" type="text" placeholder="Opponent" autocomplete="off"></div><div><label for="date">Date</label><input id="date" type="date"></div></div></section><section class="section"><h2>Roster and Defense</h2><div class="controls-grid"><div><label for="savedRoster">Saved Team Roster</label><select id="savedRoster"><option value="">New roster</option></select></div><div class="roster-actions"><button id="saveRosterBtn" type="button">Save Current Roster</button><button id="newRosterBtn" type="button">New Roster</button><button id="deleteRosterBtn" type="button">Delete Roster</button></div><div><label>Defensive Layout</label><div class="segmented"><button id="nineBtn" type="button">9 Players</button><button id="tenBtn" class="active" type="button">10 Players</button></div></div></div></section><section class="section"><h2>15-Player Batting Order</h2><div id="players" class="players"></div><div id="status" class="status">Tap any player box to type.</div></section><section class="section"><h2>Six Defensive Innings</h2><div id="innings" class="innings"></div></section></main><script>const STORAGE_KEY="iphone-baseball-lineup-v2";const ROSTER_KEY="iphone-baseball-rosters-v1";let defenseMode="10";const positions10=[["C","c"],["P","p"],["1B","b1"],["2B","b2"],["SS","ss"],["3B","b3"],["LF","lf"],["LCF","lcf"],["RCF","rcf"],["RF","rf"]];const positions9=[["C","c"],["P","p"],["1B","b1"],["2B","b2"],["SS","ss"],["3B","b3"],["LF","lf"],["CF","lcf"],["RF","rf"]];const playersEl=document.getElementById("players");const inningsEl=document.getElementById("innings");const statusEl=document.getElementById("status");for(let i=1;i<=15;i++){const row=document.createElement("div");row.className="player-row";row.innerHTML=`<div class="order">${i}</div><input id="player-name-${i}" class="player-name" type="text" placeholder="Player name" autocomplete="off" autocapitalize="words"><input id="player-number-${i}" class="player-number" type="text" inputmode="numeric" maxlength="3" placeholder="#" autocomplete="off">`;playersEl.appendChild(row)}for(let inning=1;inning<=6;inning++){const card=document.createElement("article");card.className="inning-card";card.id=`inning-${inning}`;const currentPositions=defenseMode==="9"?positions9:positions10;const posHtml=currentPositions.map(([name,cls])=>`<div class="pos ${cls}"><span class="tag">${name}</span><select id="inning-${inning}-${name}" data-player-select><option value="">Select player</option></select></div>`).join("");const sits=Array.from({length:5},(_,idx)=>`<select id="inning-${inning}-sit-${idx+1}" data-player-select><option value="">Select sit</option></select>`).join("");card.innerHTML=`<h2 class="inning-title">Inning ${inning}</h2><div class="diamond"><div class="dirt"></div><div class="grass"></div><div class="mound"></div><div class="home"></div>${posHtml}</div><div class="sits"><h3>Sits</h3><div class="sit-grid">${sits}</div></div>`;inningsEl.appendChild(card)}function rebuildDiamonds(){const saved={};document.querySelectorAll("[data-player-select]").forEach(el=>saved[el.id]=el.value);inningsEl.innerHTML="";for(let inning=1;inning<=6;inning++){const card=document.createElement("article");card.className="inning-card";card.id=`inning-${inning}`;const currentPositions=defenseMode==="9"?positions9:positions10;const posHtml=currentPositions.map(([name,cls])=>`<div class="pos ${cls}"><span class="tag">${name}</span><select id="inning-${inning}-${name}" data-player-select><option value="">Select player</option></select></div>`).join("");const sitCount=defenseMode==="9"?6:5;const sits=Array.from({length:sitCount},(_,idx)=>`<select id="inning-${inning}-sit-${idx+1}" data-player-select><option value="">Select sit</option></select>`).join("");card.innerHTML=`<h2 class="inning-title">Inning ${inning}</h2><div class="diamond"><div class="dirt"></div><div class="grass"></div><div class="mound"></div><div class="home"></div>${posHtml}</div><div class="sits"><h3>Sits</h3><div class="sit-grid">${sits}</div></div>`;inningsEl.appendChild(card)}updateDropdowns(false);Object.entries(saved).forEach(([id,value])=>{const el=document.getElementById(id);if(el)el.value=value})}function getRosters(){try{return JSON.parse(localStorage.getItem(ROSTER_KEY)||"{}")}catch{return{}}}function refreshRosterList(selected=""){const select=document.getElementById("savedRoster");const rosters=getRosters();select.innerHTML='<option value="">New roster</option>';Object.keys(rosters).sort().forEach(name=>{const option=document.createElement("option");option.value=name;option.textContent=name;select.appendChild(option)});if(selected&&rosters[selected])select.value=selected}function saveCurrentRoster(){const team=document.getElementById("team").value.trim();if(!team){alert("Enter a team name first.");return}const roster=[];for(let i=1;i<=15;i++){roster.push({name:document.getElementById(`player-name-${i}`).value,number:document.getElementById(`player-number-${i}`).value})}const rosters=getRosters();rosters[team]=roster;localStorage.setItem(ROSTER_KEY,JSON.stringify(rosters));refreshRosterList(team);statusEl.textContent="Roster saved."}function loadRoster(name){if(!name)return;const roster=getRosters()[name];if(!roster)return;document.getElementById("team").value=name;roster.forEach((player,index)=>{document.getElementById(`player-name-${index+1}`).value=player.name||"";document.getElementById(`player-number-${index+1}`).value=player.number||""});updateDropdowns();save()}function newRoster(){document.getElementById("savedRoster").value="";document.getElementById("team").value="";for(let i=1;i<=15;i++){document.getElementById(`player-name-${i}`).value="";document.getElementById(`player-number-${i}`).value=""}updateDropdowns()}function deleteRoster(){const name=document.getElementById("savedRoster").value;if(!name)return;if(!confirm(`Delete saved roster "${name}"?`))return;const rosters=getRosters();delete rosters[name];localStorage.setItem(ROSTER_KEY,JSON.stringify(rosters));refreshRosterList();statusEl.textContent="Roster deleted."}function setDefenseMode(mode){defenseMode=mode;document.getElementById("nineBtn").classList.toggle("active",mode==="9");document.getElementById("tenBtn").classList.toggle("active",mode==="10");rebuildDiamonds();save()}function getPlayers(){const list=[];for(let i=1;i<=15;i++){const name=document.getElementById(`player-name-${i}`).value.trim();const number=document.getElementById(`player-number-${i}`).value.trim();if(name){list.push({id:String(i),label:number?`${name} #${number}`:name})}}return list}function updateDropdowns(saveAfter=true){const list=getPlayers();document.querySelectorAll("[data-player-select]").forEach(select=>{const current=select.value;const sit=select.id.includes("-sit-");select.innerHTML=`<option value="">${sit?"Select sit":"Select player"}</option>`;list.forEach(player=>{const option=document.createElement("option");option.value=player.id;option.textContent=player.label;select.appendChild(option)});if(list.some(player=>player.id===current))select.value=current});if(saveAfter)save();statusEl.textContent="Player dropdowns updated."}function allFields(){return Array.from(document.querySelectorAll("input,select"))}function save(){const data={defenseMode};allFields().forEach(field=>data[field.id]=field.value);localStorage.setItem(STORAGE_KEY,JSON.stringify(data));statusEl.textContent="Saved."}function load(){const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;try{const data=JSON.parse(raw);if(data.defenseMode){defenseMode=data.defenseMode;rebuildDiamonds()}Object.entries(data).forEach(([id,value])=>{const field=document.getElementById(id);if(field&&field.tagName!=="SELECT")field.value=value});updateDropdowns(false);Object.entries(data).forEach(([id,value])=>{const field=document.getElementById(id);if(field&&field.tagName==="SELECT")field.value=value});statusEl.textContent="Saved lineup loaded."}catch{statusEl.textContent="Could not load saved lineup."}}function clearAll(){if(!confirm("Clear all players and innings?"))return;allFields().forEach(field=>field.value="");localStorage.removeItem(STORAGE_KEY);updateDropdowns(false);statusEl.textContent="Lineup cleared."}let timer;document.addEventListener("input",event=>{if(!event.target.matches("input"))return;clearTimeout(timer);timer=setTimeout(()=>{if(event.target.classList.contains("player-name")||event.target.classList.contains("player-number")){updateDropdowns()}else{save()}},250)});document.addEventListener("change",event=>{if(event.target.matches("input,select"))save()});document.getElementById("updateBtn").addEventListener("click",()=>updateDropdowns());document.getElementById("clearBtn").addEventListener("click",clearAll);document.getElementById("printBtn").addEventListener("click",()=>window.print());document.getElementById("nineBtn").addEventListener("click",()=>setDefenseMode("9"));document.getElementById("tenBtn").addEventListener("click",()=>setDefenseMode("10"));document.getElementById("saveRosterBtn").addEventListener("click",saveCurrentRoster);document.getElementById("newRosterBtn").addEventListener("click",newRoster);document.getElementById("deleteRosterBtn").addEventListener("click",deleteRoster);document.getElementById("savedRoster").addEventListener("change",e=>loadRoster(e.target.value));refreshRosterList();if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}load();</script></body></html>
